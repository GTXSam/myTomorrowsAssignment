apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mytom-service-monitor
  labels:
    release: my-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: mytomapp
  endpoints:
    - interval: 15s
      port: http
      honorLabels: true
  namespaceSelector:
    matchNames:
      - mytomorrowstest
      - mytomorrows
